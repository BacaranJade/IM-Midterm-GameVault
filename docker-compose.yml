version: '3.8'

services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gamevault_backend
    restart: unless-stopped

    env_file:
      - ./Backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./Backend:/var/www/html

    working_dir: /var/www/html

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gamevault_frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./Frontend:/app
      - /app/node_modules

    depends_on:
      - backend